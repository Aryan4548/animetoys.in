# Nginx configuration for Anime & Toy Universe
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/anime-toy-universe
#   (edit the server_name and paths below first)
#   sudo ln -s /etc/nginx/sites-available/anime-toy-universe /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot (see README "SSL / HTTPS") to add the HTTPS server
# block and HTTP->HTTPS redirect automatically.

# Redirect www -> apex (remove this block if you want www as canonical instead)
server {
    listen 80;
    listen [::]:80;
    server_name www.YOURDOMAIN.com;
    return 301 http://YOURDOMAIN.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOURDOMAIN.com;

    client_max_body_size 10M;

    # Security headers (Next.js also sets some of these via next.config.mjs;
    # kept here too so they apply even to files Nginx serves directly).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve uploaded product/category/brand/banner/blog images directly from
    # disk instead of proxying through Node — faster, and keeps Node free for
    # actual app requests. Must match MEDIA_ROOT in .env.
    location /api/media/ {
        alias /var/www/anime-toy-universe-storage/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Next.js static assets — long-lived cache, filenames are content-hashed.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else -> the Next.js app running under PM2 on port 3000.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
